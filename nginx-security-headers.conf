# Security headers for every response, including errors. Included at server level AND in every
# location that sets its own add_header: nginx drops inherited add_header directives in such a
# location.
# TLS is terminated at the reverse proxy (Traefik/Dokploy); HSTS is set there too. The headers
# below are belt-and-braces from nginx itself.
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Robots-Tag "noindex, nofollow" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
# CSP — adjust connect-src if API/auth host changes. recharts/Radix need
# inline styles; Vite emits hashed JS so 'unsafe-inline' is NOT allowed for scripts.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://api.reinigungs-portal.com wss://api.reinigungs-portal.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
